name: Issue Janitor

on:
  schedule:
    # Run once daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  janitor:
    name: Stale Issues and PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mark and Close Stale Items
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: "This issue has been automatically marked as stale due to 60 days of inactivity. It will be closed in 7 days if no further activity occurs."
          close-issue-message: "This issue has been automatically closed due to inactivity."
          days-before-pr-stale: 60
          days-before-pr-close: 7
          stale-pr-label: "stale"
          stale-pr-message: "This PR has been automatically marked as stale due to 60 days of inactivity. It will be closed in 7 days if no further activity occurs."
          close-pr-message: "This PR has been automatically closed due to inactivity."