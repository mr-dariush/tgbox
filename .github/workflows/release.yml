name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    name: Build, Attest & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go Toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Compile Cross-Platform Example Binaries
        run: |
          mkdir -p dist
          TAG_NAME="${GITHUB_REF_NAME}"

          TARGETS=(
            "linux/amd64/tgbox-bot-linux-amd64"
            "linux/arm64/tgbox-bot-linux-arm64"
            "darwin/amd64/tgbox-bot-darwin-amd64"
            "darwin/arm64/tgbox-bot-darwin-arm64"
            "windows/amd64/tgbox-bot-windows-amd64.exe"
          )

          for target in "${TARGETS[@]}"; do
            IFS="/" read -r GOOS GOARCH OUT_FILE <<< "$target"
            echo "==> Compiling artifact for $GOOS/$GOARCH..."
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${TAG_NAME}" \
              -o "dist/${OUT_FILE}" \
              ./examples/bot/main.go
          done

      - name: Generate Software Bill of Materials (SPDX Standard)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ./dist
          format: spdx-json
          output-file: ./dist/sbom.spdx.json

      - name: Generate Consolidated Checksums
        working-directory: dist
        run: |
          sha256sum tgbox-bot-* sbom.spdx.json > checksums.txt
          cat checksums.txt

      - name: Attest Artifact Provenance (SLSA Level 3)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release with Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Release ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag