name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Fast-Fail Static Linting & Formatting Gatekeeper
  # ----------------------------------------------------------------------------
  lint:
    name: Lint & Code Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go Toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.3.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Execute GolangCI-Lint Runner
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  # ----------------------------------------------------------------------------
  # 2. Linux Suite with Containerized Redis Service
  # ----------------------------------------------------------------------------
  test-linux:
    name: Test (Linux / Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go: [ "stable" ]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Run Tests with Race Detector and Coverage Profiling
        env:
          REDIS_ADDR: "127.0.0.1:6379"
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Verify Mandatory Code Coverage Threshold (75%)
        run: |
          go tool cover -func=coverage.txt | awk '/total:/ {
            cov = substr($NF, 1, length($NF)-1)
            print "Calculated Statement Coverage: " cov "%"
            if (cov + 0 < 75.0) {
              print "Validation Error: Coverage " cov "% is below mandatory 75% threshold."
              exit 1
            }
          }'

      - name: Archive Coverage Profile Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.txt
          retention-days: 14



  # ----------------------------------------------------------------------------
  # 3. macOS Darwin Socket & BSD Stack Validation
  # ----------------------------------------------------------------------------
  test-macos:
    name: Test (macOS / Latest Go)
    needs: [ lint ]
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go Toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.3.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

  # ----------------------------------------------------------------------------
  # 4. Windows Winsock & File Locking Validation
  # ----------------------------------------------------------------------------
  test-windows:
    name: Test (Windows / Latest Go)
    needs: [ lint ]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go Toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5.3.0
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run Tests with Sequential Package Execution Guard
        run: go test -v -p=1 ./...